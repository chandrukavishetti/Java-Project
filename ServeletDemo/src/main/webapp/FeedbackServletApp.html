<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Feedback System</title>
</head>
<body>

	<h2>E-Commerce Product Feedback System</h2>

	<form action="feedback" method="post">

		Product ID: <input type="text" name="id"><br>
		<br> Rating (1-5): <input type="text" name="rating"><br>
		<br> Review: <input type="text" name="review"><br>
		<br> <input type="submit" value="Submit">

	</form>

</body>
</html>
