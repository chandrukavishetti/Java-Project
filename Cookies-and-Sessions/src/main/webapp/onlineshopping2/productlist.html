<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Product List</title>
</head>
<body>

	<h1>Online Shopping</h1>

	<form action="../add-to-cart" method="post">
		<table border="1">
			<tr>
				<th>Select</th>

				<th>Price</th>
			</tr>

			<tr>
				<td><input type="checkbox" name="product" value="Keyboard-800"></td>
				<td>Keyboard</td>
				<td>800</td>
			</tr>

			<tr>
				<td><input type="checkbox" name="product" value="Mouse-500"></td>
				<td>Mouse</td>
				<td>500</td>
			</tr>

			<tr>
				<td><input type="checkbox" name="product" value="Monitor-7000"></td>
				<td>Monitor</td>
				<td>7000</td>
			</tr>

			<tr>
				<td><input type="checkbox" name="product" value="USB Cable-250"></td>
				<td>USB Cable</td>
				<td>250</td>
			</tr>

			<tr>
				<td><input type="checkbox" name="product"
					value="Laptop Stand-1200"></td>
				<td>Laptop Stand</td>
				<td>1200</td>
			</tr>

		</table>

		<br> <input type="submit" value="Add to Cart">
	</form>

	<br>
	<a href="viewCart.jsp">View Cart</a>

</body>
</html>
